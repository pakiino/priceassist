name: Test Python Script

on:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-python-script.yml"
  pull_request:
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-python-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check that main.py and pricing.py compile
        run: python -m py_compile main.py pricing.py
      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
